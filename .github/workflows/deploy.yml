name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    # 每天北京时间 06:00 自动刷新粉丝数（cron 使用 UTC）
    - cron: '0 22 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # 回写快照产生的提交带 [skip ci]，避免再次触发部署形成循环
    if: github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 部署前刷新粉丝数；抓不到就沿用仓库里的旧值，不让整次部署失败
      - name: Sync Bilibili stats
        run: npm run sync:stats
        continue-on-error: true

      # 把新快照提交回仓库，保证下次构建（以及本地开发）也能拿到最新值
      - name: Commit stats snapshot
        continue-on-error: true
        run: |
          if git diff --quiet -- src/data/stats.json; then
            echo "stats.json 无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/stats.json
          git commit -m "chore(stats): 同步 B 站粉丝数快照 [skip ci]"
          git push origin HEAD:master

      - name: Build
        run: npm run build 2>&1

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
